name: radar

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/skills.json"
      - "scripts/radar.py"

jobs:
  radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: generate radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/radar.py \
            --skills assets/skills.json \
            --github aniketwazarkar \
            -o assets/radar \
            --limit 7 --curve 0.4 --values \
            --exclude "html,css,shell,dockerfile,makefile,jupyter notebook"

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh skill radar"
          file_pattern: "assets/radar.svg"
